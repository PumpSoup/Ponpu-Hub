<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="45%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Neon Gradients -->
    <linearGradient id="neonPinkCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="cyberPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="visorGlass" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="hoodieInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" fill="url(#bgGlow)" />

  <!-- Background Neon Music Circles / Waves -->
  <circle cx="250" cy="230" r="190" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 12" />
  <circle cx="250" cy="230" r="160" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-opacity="0.3" stroke-dasharray="14 18" />
  <circle cx="250" cy="230" r="130" fill="none" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.35" />

  <!-- Neon Equalizer Soundwaves in Background -->
  <g opacity="0.4" filter="url(#softGlow)">
    <rect x="70" y="210" width="6" height="40" rx="3" fill="#f43f5e" />
    <rect x="85" y="190" width="6" height="80" rx="3" fill="#ec4899" />
    <rect x="100" y="225" width="6" height="45" rx="3" fill="#a855f7" />
    <rect x="394" y="220" width="6" height="50" rx="3" fill="#a855f7" />
    <rect x="409" y="185" width="6" height="85" rx="3" fill="#38bdf8" />
    <rect x="424" y="215" width="6" height="45" rx="3" fill="#06b6d4" />
  </g>

  <!-- Streetwear Jacket / Hoodie -->
  <g id="body">
    <!-- Outer shoulders -->
    <path d="M70 500 C75 420, 130 365, 200 350 L250 380 L300 350 C370 365, 425 420, 430 500 Z" fill="url(#jacketGrad)" stroke="#334155" stroke-width="2" />
    
    <!-- Neon Seam Accents on Jacket -->
    <path d="M125 470 C145 410, 180 375, 220 365" fill="none" stroke="url(#cyberPink)" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)" />
    <path d="M375 470 C355 410, 320 375, 280 365" fill="none" stroke="url(#cyberCyan)" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)" />

    <!-- Hoodie collar inner -->
    <path d="M190 352 C190 352, 215 440, 250 440 C285 440, 310 352, 310 352 C285 365, 215 365, 190 352 Z" fill="url(#hoodieInner)" />
    <path d="M225 365 L250 440 L275 365" fill="none" stroke="#f43f5e" stroke-width="2.5" opacity="0.7" />
  </g>

  <!-- Neck -->
  <path d="M218 290 L218 360 C235 370, 265 370, 282 360 L282 290 Z" fill="#d4a373" />
  <!-- Neck shadow -->
  <path d="M218 290 C235 315, 265 315, 282 290 L282 318 C265 330, 235 330, 218 318 Z" fill="#b07d56" opacity="0.6" />

  <!-- Head / Face -->
  <g id="head">
    <!-- Chin and cheeks -->
    <path d="M185 200 C185 290, 220 325, 250 325 C280 325, 315 290, 315 200 C315 140, 280 135, 250 135 C220 135, 185 140, 185 200 Z" fill="#e5b88f" />
    
    <!-- Neon Rim Light on Face (Pink Left, Cyan Right) -->
    <path d="M187 195 C187 270, 215 315, 245 323" fill="none" stroke="#f43f5e" stroke-width="5" stroke-linecap="round" opacity="0.8" filter="url(#softGlow)" />
    <path d="M313 195 C313 270, 285 315, 255 323" fill="none" stroke="#06b6d4" stroke-width="5" stroke-linecap="round" opacity="0.8" filter="url(#softGlow)" />

    <!-- Sleek Hair (Cool Modern Style) -->
    <path d="M175 185 C170 145, 195 95, 250 90 C305 95, 330 145, 325 185 C315 155, 305 140, 290 140 C275 140, 270 152, 250 148 C230 144, 220 155, 205 155 C190 155, 182 170, 175 185 Z" fill="#0f172a" />
    
    <!-- Hair Strands & Neon Highlights -->
    <path d="M205 118 C230 100, 270 98, 295 115" fill="none" stroke="#a855f7" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)" />
    <path d="M190 142 C210 120, 245 115, 265 125" fill="none" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" />
    <path d="M260 110 C280 112, 305 125, 315 150" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

    <!-- Modern Cyber Visor / Shades -->
    <g id="visor" filter="url(#glow)">
      <!-- Visor frame -->
      <path d="M178 192 C195 188, 230 186, 250 186 C270 186, 305 188, 322 192 C325 215, 315 240, 285 242 C265 244, 255 235, 250 235 C245 235, 235 244, 215 242 C185 240, 175 215, 178 192 Z" fill="url(#visorGlass)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8" />
      
      <!-- Visor Highlight Sheen -->
      <path d="M185 198 L240 192 L230 205 L182 208 Z" fill="#ffffff" opacity="0.45" />
      
      <!-- Digital Audio Wave Reflection inside Shades -->
      <path d="M195 220 L205 214 L215 226 L225 212 L235 222 L245 216 L255 224 L265 213 L275 225 L285 215 L295 222 L305 218" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    </g>

    <!-- Nose subtle shadow -->
    <path d="M246 250 L250 262 L254 250" fill="none" stroke="#b07d56" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Confident Artist Smile -->
    <path d="M232 280 C242 288, 258 288, 268 280" fill="none" stroke="#9a3412" stroke-width="3" stroke-linecap="round" />
    <path d="M242 284 C247 287, 253 287, 258 284" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- DJ / Producer Headphones -->
  <g id="headphones">
    <!-- Headband Arc -->
    <path d="M165 190 C155 100, 200 65, 250 65 C300 65, 345 100, 335 190" fill="none" stroke="#1e293b" stroke-width="18" stroke-linecap="round" />
    <path d="M175 175 C168 110, 205 80, 250 80 C295 80, 332 110, 325 175" fill="none" stroke="url(#neonPinkCyan)" stroke-width="5" stroke-linecap="round" filter="url(#softGlow)" />

    <!-- Left Ear Cup (Pink Glow) -->
    <g filter="url(#glow)">
      <rect x="150" y="175" width="28" height="65" rx="14" fill="#0f172a" stroke="#f43f5e" stroke-width="3.5" />
      <!-- Inner Glowing Core -->
      <circle cx="164" cy="207" r="8" fill="#f43f5e" />
      <path d="M164 195 L164 220" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Right Ear Cup (Cyan Glow) -->
    <g filter="url(#glow)">
      <rect x="322" y="175" width="28" height="65" rx="14" fill="#0f172a" stroke="#06b6d4" stroke-width="3.5" />
      <!-- Inner Glowing Core -->
      <circle cx="336" cy="207" r="8" fill="#06b6d4" />
      <path d="M336 195 L336 220" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Floating Sparkles / Neon Music Elements -->
  <g filter="url(#softGlow)" opacity="0.85">
    <!-- Star sparkle left -->
    <path d="M115 140 Q125 140 125 130 Q125 140 135 140 Q125 140 125 150 Q125 140 115 140 Z" fill="#f43f5e" />
    <!-- Star sparkle right -->
    <path d="M365 130 Q375 130 375 120 Q375 130 385 130 Q375 130 375 140 Q375 130 365 130 Z" fill="#38bdf8" />
    <!-- Small cyan dot -->
    <circle cx="390" cy="290" r="3.5" fill="#06b6d4" />
    <circle cx="110" cy="300" r="3" fill="#ec4899" />
  </g>

  <!-- Circular Outer Vignette / Mask Accent -->
  <circle cx="250" cy="250" r="245" fill="none" stroke="url(#neonPinkCyan)" stroke-width="2" opacity="0.4" />
</svg>
